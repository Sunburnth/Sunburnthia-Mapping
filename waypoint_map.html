<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interstate Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family: monospace; }

#app { width:100%; height:100%; display:flex; flex-direction:column; }

#bar {
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
  border-bottom: 1px solid #333;
  z-index: 10;
  font-family: monospace;
}

#bar h1 { font-size: 11px; letter-spacing: 0; margin-right: 8px; font-family: monospace; font-weight: bold; }

.section-label {
  font-size: 10px;
  opacity: 0.6;
  margin-left: 8px;
}

.theme-btn {
  padding: 4px 10px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  font-family: monospace;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.theme-btn:hover { filter: brightness(1.3); }
.theme-btn.active { border-color: white !important; }

#svg-wrap { flex: 1; overflow: hidden; }
svg { width: 100%; height: 100%; }

.state { transition: fill 0.4s; }
.nation { fill: none; }
.city-dot { cursor: pointer; transition: fill 0.4s; stroke: #000; stroke-width: 0.25px; }
.city-dot.city-highlighted { stroke: #ff00ff; stroke-width: 2px; fill: #ff00ff !important; opacity: 1 !important; }
.permit-zone { stroke: #ff6600; stroke-width: 0.4px; }

#panel-column {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  align-items: flex-end;
}
#istate-panel {
  width: 240px;
  background: var(--ip-bg, #0d1a0d);
  border: 1px solid var(--ip-border, #2a5a2a);
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  color: var(--ip-fg, #7aff7a);
  box-shadow: 0 2px 14px rgba(0,0,0,0.5);
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}
#custom-panel {
  width: 240px;
  background: var(--ip-bg, #0d1a0d);
  border: 1px solid var(--ip-border, #2a5a2a);
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  color: var(--ip-fg, #7aff7a);
  box-shadow: 0 2px 14px rgba(0,0,0,0.5);
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}
#custom-header {
  padding: 6px 10px;
  border-bottom: 1px solid var(--ip-border, #2a5a2a);
  letter-spacing: 2px;
  font-size: 10px;
  opacity: 0.8;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#custom-header span { opacity: 0.5; font-size: 9px; cursor: pointer; }
#custom-header span:hover { opacity: 1; }
#custom-add-row {
  padding: 7px 10px;
  display: flex;
  gap: 5px;
  align-items: center;
  border-bottom: 1px solid var(--ip-border, #2a5a2a);
}
#custom-hw-input {
  flex: 1;
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 2px;
  outline: none;
  direction: ltr;
  min-width: 0;
}
#custom-hw-btn {
  padding: 3px 8px;
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 11px;
  border-radius: 2px;
  cursor: pointer;
  white-space: nowrap;
}
#custom-hw-btn:hover { opacity: 0.8; }
#custom-list {
  max-height: 260px;
  overflow-y: auto;
}
#istate-header {
  padding: 6px 10px;
  border-bottom: 1px solid var(--ip-border, #2a5a2a);
  letter-spacing: 2px;
  font-size: 10px;
  opacity: 0.8;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#istate-header span { opacity: 0.5; font-size: 9px; cursor: pointer; }
#istate-header span:hover { opacity: 1; }
#istate-add-row {
  padding: 7px 10px;
  display: flex;
  gap: 5px;
  align-items: center;
  border-bottom: 1px solid var(--ip-border, #2a5a2a);
}
#istate-prefix {
  font-size: 12px;
  font-weight: bold;
  opacity: 0.7;
  flex-shrink: 0;
}
#istate-input {
  flex: 1;
  min-width: 40px;
  max-width: 60px;
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 12px;
  font-weight: bold;
  padding: 3px 6px;
  border-radius: 2px;
  outline: none;
  direction: ltr;
  text-align: left;
  unicode-bidi: bidi-override;
}
#istate-fetch-btn {
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 2px;
  cursor: pointer;
}
#istate-fetch-btn:hover { opacity: 0.8; }
#istate-status {
  padding: 3px 10px 5px;
  font-size: 10px;
  opacity: 0.6;
  min-height: 16px;
}
#istate-draw-controls {
  display: none;
  padding: 6px 10px;
  gap: 5px;
  flex-wrap: wrap;
  border-top: 1px solid var(--ip-border, #2a5a2a);
  border-bottom: 1px solid var(--ip-border, #2a5a2a);
}
#istate-draw-controls.active { display: flex; }
#istate-draw-controls button {
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 2px;
  cursor: pointer;
}
#istate-draw-controls button:hover { opacity: 0.7; }
#istate-draw-controls button:disabled { opacity: 0.25; cursor: default; }
#istate-draw-label { font-size: 10px; opacity: 0.7; flex-basis: 100%; }
#custom-draw-controls {
  display: none;
  padding: 6px 10px;
  gap: 5px;
  flex-wrap: wrap;
  border-top: 1px solid var(--ip-border, #2a5a2a);
  border-bottom: 1px solid var(--ip-border, #2a5a2a);
}
#custom-draw-controls.active { display: flex; }
#custom-draw-controls button {
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 2px;
  cursor: pointer;
}
#custom-draw-controls button:hover { opacity: 0.7; }
#custom-draw-controls button:disabled { opacity: 0.25; cursor: default; }
#custom-draw-label { font-size: 10px; opacity: 0.7; flex-basis: 100%; }
#istate-list {
  max-height: 180px;
  overflow-y: auto;
  padding: 4px 0 4px;
}
.istate-item {
  display: flex;
  align-items: center;
  padding: 4px 10px;
  gap: 5px;
  border-bottom: 1px solid var(--ip-border, #1a3a1a);
}
.istate-item:last-child { border-bottom: none; }
.istate-name-edit {
  background: transparent; border: none; border-bottom: 1px solid transparent;
  color: inherit; font-size: 11px; font-weight: 600; width: 90px;
  cursor: text; outline: none; padding: 0;
}
.istate-name-edit:hover, .istate-name-edit:focus {
  border-bottom-color: var(--ip-accent, #1aff1a);
} 
.istate-name-label { flex: 1; font-size: 11px; font-weight: bold; }
.istate-item input[type=color] {
  width: 16px; height: 16px; border: none; padding: 0;
  background: none; cursor: pointer; flex-shrink: 0;
}
.istate-btn {
  background: none; border: none;
  color: var(--ip-fg, #7aff7a);
  cursor: pointer; font-size: 10px;
  padding: 1px 3px; border-radius: 2px;
  opacity: 0.6;
}
.istate-btn:hover { opacity: 1; }
.istate-btn.del { color: #ff4444; }
.istate-built-row {
  padding: 2px 10px 5px 22px;
  font-size: 10px;
  opacity: 0.55;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.seg-item {
  display: flex;
  align-items: center;
  padding: 2px 10px 2px 22px;
  gap: 5px;
  font-size: 10px;
  border-bottom: 1px solid var(--ip-border, #1a3a1a);
}
.seg-item:last-child { border-bottom: none; }
.seg-label { flex: 1; opacity: 0.75; }
.seg-item input[type=color] { width:14px;height:14px;border:none;background:none;cursor:pointer;flex-shrink:0; }
#custom-hw-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 10px;
  border-top: 1px solid var(--ip-border, #2a5a2a);
}
#custom-hw-btn {
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 2px;
  cursor: pointer;
  white-space: nowrap;
}
#custom-hw-btn:hover { opacity: 0.8; }
#istate-color-mode-btn {
  background: transparent;
  border: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
}
#istate-color-mode-btn.active {
  background: var(--ip-fg, #7aff7a);
  color: var(--ip-bg, #0d1a0d);
}
.istate-ref-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 10;
  cursor: pointer;
}
.istate-ref-hit:hover ~ .istate-ref-vis,
.istate-ref-hit:hover + .istate-ref-vis { opacity: 0.7 !important; }
.istate-ref-vis { pointer-events: none; }
.istate-planned {
  stroke-dasharray: 8,6;
  opacity: 0.3;
}
@keyframes loadPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
#istate-status.loading { animation: loadPulse 1.2s infinite; }

#tooltip {
  position: fixed;
  padding: 5px 10px;
  border-radius: 3px;
  font-family: monospace;
  font-size: 12px;
  pointer-events: none;
  display: none;
  z-index: 99;
  white-space: nowrap;
  border: 1px solid;
}

/* ── Interstate Dropdown ── */
#custom-dropdown-wrap {
  position: relative;
  display: inline-block;
}
#custom-dropdown-btn.open { border-color: white; }
#custom-dropdown {
  display: none;
  position: fixed;
  margin-top: 2px;
  width: 200px;
  max-height: 360px;
  background: var(--sb-bg, #dce8dc);
  border: 1px solid var(--sb-border, #80a880);
  border-radius: 4px;
  color: var(--sb-fg, #1a4020);
  font-family: monospace;
  font-size: 11px;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  flex-direction: column;
  overflow-y: auto;
  padding: 4px 0;
}
#custom-dropdown.open { display: flex; }
#custom-dropdown-wrap {
  position: relative;
  display: inline-block;
}
#istate-dropdown-btn.open { border-color: white; }
#istate-dropdown {
  display: none;
  position: fixed;
  margin-top: 2px;
  width: 170px;
  max-height: 420px;
  background: var(--sb-bg, #dce8dc);
  border: 1px solid var(--sb-border, #80a880);
  border-radius: 4px;
  color: var(--sb-fg, #1a4020);
  font-family: monospace;
  font-size: 11px;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  flex-direction: column;
}
#istate-dropdown.open { display: flex; }
#dropdown-content {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
#dropdown-content::-webkit-scrollbar { width: 5px; }
#dropdown-content::-webkit-scrollbar-thumb { background: var(--sb-border, #80a880); border-radius: 3px; }
.sb-item {
  display: flex;
  align-items: center;
  padding: 3px 10px;
  gap: 6px;
  cursor: pointer;
  transition: background 0.1s;
}
.sb-item:hover { filter: brightness(0.95); }
.sb-item input[type=checkbox] {
  accent-color: var(--sb-fg, #1a4020);
  cursor: pointer;
  flex-shrink: 0;
  width: 13px; height: 13px;
}
.sb-item label {
  cursor: pointer;
  flex: 1;
  font-size: 11px;
  font-weight: bold;
}
.sb-item .sb-status {
  font-size: 9px;
  opacity: 0.5;
  flex-shrink: 0;
  min-width: 14px;
  text-align: right;
}
.sb-item .sb-status.loading { animation: sbPulse 1s infinite; }
@keyframes sbPulse { 0%,100%{opacity:0.3} 50%{opacity:0.9} }
.sb-item .sb-swatch {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  display: none;
}
.sb-item.active .sb-swatch { display: block; }
#dropdown-status {
  padding: 4px 10px;
  font-size: 9px;
  opacity: 0.5;
  flex-shrink: 0;
  border-top: 1px solid var(--sb-border, #80a880);
  min-height: 18px;
}

/* ── Interstate labels ── */
.istate-label {
  font-family: monospace;
  font-size: 11px;
  font-weight: bold;
  fill: white;
  paint-order: stroke;
  stroke-linejoin: round;
  pointer-events: none;
  user-select: none;
}

/* ── Segment notes ── */
.seg-notes {
  width: 100%;
  background: transparent;
  border: none;
  border-top: 1px solid var(--ip-border, #2a5a2a);
  color: var(--ip-fg, #7aff7a);
  font-family: monospace;
  font-size: 10px;
  padding: 3px 10px 3px 22px;
  resize: none;
  outline: none;
  opacity: 0.7;
  box-sizing: border-box;
}
.seg-notes:focus { opacity: 1; }
.seg-notes::placeholder { opacity: 0.4; }

/* ── Favorites panel ── */
#fav-panel {
  width: 240px;
  background: var(--ip-bg, #0d1a0d);
  border: 1px solid var(--ip-border, #2a5a2a);

  font-family: monospace;
  font-size: 11px;

}

  padding: 6px 10px;
  border-bottom: 1px solid var(--ip-border, #2a5a2a);

}

#fav-list { max-height: 180px; overflow-y: auto; padding: 4px 0; }
.fav-item {
  display: flex;
  align-items: center;
  padding: 3px 10px;
  gap: 6px;
  font-size: 11px;
  border-bottom: 1px solid var(--ip-border, #1a3a1a);
  cursor: pointer;
}
.fav-item:last-child { border-bottom: none; }
.fav-item:hover { opacity: 0.8; }
.fav-star {
  background: none; border: none;
  color: var(--ip-fg, #7aff7a);
  cursor: pointer; font-size: 12px;
  padding: 1px 3px; opacity: 0.5;
  flex-shrink: 0;
}
.fav-star:hover { opacity: 1; }
.fav-star.active { opacity: 1; color: #ffee00; }

/* ── Segments top-bar dropdown ── */
#seg-dropdown-wrap {
  position: relative;
  display: inline-block;
}
#seg-dropdown-btn.open { border-color: white; }
#seg-dropdown {
  display: none;
  position: fixed;
  margin-top: 2px;
  width: 300px;
  max-height: 480px;
  background: var(--sb-bg, #dce8dc);

.seg-dd-route-header .seg-dd-chevron {
  margin-left: auto; font-size: 9px; opacity: 0.5;
}
.seg-dd-segs { padding: 0 0 4px 0; }
.seg-dd-item {
  display: flex;
  align-items: center;

  font-size: 10px;

}
.seg-dd-label { flex: 1; opacity: 0.8; min-width: 80px; }
.seg-dd-status {
  font-size: 10px; padding: 2px 4px; border-radius: 2px;

  background: #ff0000; color: #000;
}
.seg-dd-notes {
  width: 100%; background: transparent;

/* ── Favorites top-bar dropdown ── */
#fav-dropdown-wrap {
  position: relative;
  display: inline-block;
}
#fav-dropdown-btn.open { border-color: white; }
#fav-dropdown {
  display: none;
  position: fixed;
  margin-top: 2px;

<body>
<div id="app">
  <div id="bar">
    <h1 id="title">Interstate Map</h1>

    <input id="istate-search-box" type="text" placeholder="Add Highlight" style="padding:4px 10px;border-radius:3px;border:1px solid var(--bar-border,#80a880);background:var(--bar-bg,#d0dcd0);color:var(--bar-color,#204820);font-family:monospace;font-size:11px;width:180px;outline:none;" />

    <span id="istate-dropdown-wrap">
      <button id="istate-dropdown-btn" class="theme-btn">⬡ Interstates</button>
      <div id="istate-dropdown">
        <div id="dropdown-content"></div>
        <div id="dropdown-status"></div>
      </div>
    </span>
    <span id="custom-dropdown-wrap">
      <button id="custom-dropdown-btn" class="theme-btn">⬡ Custom Highways</button>

const svg = d3.select("#usa");
const tooltip = d3.select("#tooltip");

function getSize() {
  const wrap = document.getElementById("svg-wrap");
  return { w: wrap.clientWidth, h: wrap.clientHeight };
}

let projection, pathGen, dots, mapGroup;

function buildMap(us) {
  const { w, h } = getSize();
  svg.attr("viewBox", `0 0 ${w} ${h}`);

  projection = d3.geoAlbersUsa()
    .scale(w * 1.28)
    .translate([w / 2, h / 2]);

  pathGen = d3.geoPath().projection(projection);

  const stateFeatures = topojson.feature(us, us.objects.states).features
    .filter(f => !SKIP_STATES.has(f.id));

  svg.selectAll("*").remove();

  mapGroup = svg.append("g");

  mapGroup.selectAll(".state")
    .data(stateFeatures)
    .join("path")
    .attr("class", "state")
    .attr("d", pathGen);

  mapGroup.append("path")
    .datum(topojson.mesh(us, us.objects.states, (a,b) => a !== b && !SKIP_STATES.has(a.id) && !SKIP_STATES.has(b.id)))
    .attr("class", "nation")
    .attr("d", pathGen);

  mapGroup.append("path")
    .datum(topojson.mesh(us, us.objects.states, (a,b) => a === b && !SKIP_STATES.has(a.id)))
    .attr("class", "nation outer")
    .attr("d", pathGen);

  // Draw regular dots first (behind), then primary on top
  const regularDots = mapGroup.selectAll(".city-dot-regular")
    .data(cities.filter(d => !PRIMARY.has(d.n) && !SECONDARY.has(d.n) && !TERTIARY.has(d.n)))
    .join("circle")
    .attr("class", d => PERMIT_ZONE_CITIES.has(d.n) ? "city-dot tier-regular permit-zone" : "city-dot tier-regular")
    .attr("r", 3)
    .attr("cx", d => { const p = projection([d.lon, d.lat]); return p ? p[0] : -999; })
    .attr("cy", d => { const p = projection([d.lon, d.lat]); return p ? p[1] : -999; });

  const tertiaryDots = mapGroup.selectAll(".city-dot-tertiary")
    .data(cities.filter(d => TERTIARY.has(d.n)))
    .join("circle")
    .attr("class", d => PERMIT_ZONE_CITIES.has(d.n) ? "city-dot tier-tertiary permit-zone" : "city-dot tier-tertiary")
    .attr("r", 4.5)
    .attr("cx", d => { const p = projection([d.lon, d.lat]); return p ? p[0] : -999; })
    .attr("cy", d => { const p = projection([d.lon, d.lat]); return p ? p[1] : -999; });

  const secondaryDots = mapGroup.selectAll(".city-dot-secondary")
    .data(cities.filter(d => SECONDARY.has(d.n)))
    .join("circle")
    .attr("class", d => PERMIT_ZONE_CITIES.has(d.n) ? "city-dot tier-secondary permit-zone" : "city-dot tier-secondary")
    .attr("r", 5)
    .attr("cx", d => { const p = projection([d.lon, d.lat]); return p ? p[0] : -999; })
    .attr("cy", d => { const p = projection([d.lon, d.lat]); return p ? p[1] : -999; });

  const primaryDots = mapGroup.selectAll(".city-dot-primary")
    .data(cities.filter(d => PRIMARY.has(d.n)))
    .join("circle")
    .attr("class", d => PERMIT_ZONE_CITIES.has(d.n) ? "city-dot tier-primary permit-zone" : "city-dot tier-primary")
    .attr("r", 6)
    .attr("cx", d => { const p = projection([d.lon, d.lat]); return p ? p[0] : -999; })
    .attr("cy", d => { const p = projection([d.lon, d.lat]); return p ? p[1] : -999; });

  dots = mapGroup.selectAll(".city-dot");

  // Base radii per tier — hover always uses these, never the current (possibly already-hovered) r
  const BASE_R = { primary: 5, secondary: 4, tertiary: 3, regular: 2.5 };
  function baseRFor(el) {
    if (el.classList.contains("tier-primary"))   return BASE_R.primary;
    if (el.classList.contains("tier-secondary"))  return BASE_R.secondary;
    if (el.classList.contains("tier-tertiary"))   return BASE_R.tertiary;
    return BASE_R.regular;
  }

  dots
    .on("mouseover", function(event, d) {
      const k = d3.zoomTransform(document.getElementById("usa")).k || 1;
      const base = baseRFor(this) * Math.pow(k, 0.4) / k;
      d3.select(this).raise().attr("r", base * 1.5);
      tooltip.style("display","block").text(d.n);
    })
    .on("mousemove", function(event) {
      tooltip.style("left", (event.clientX+12)+"px").style("top",(event.clientY-28)+"px");
    })
    .on("mouseout", function(event, d) {
      const k = d3.zoomTransform(document.getElementById("usa")).k || 1;
      const base = baseRFor(this) * Math.pow(k, 0.4) / k;
      d3.select(this).attr("r", base);
      tooltip.style("display","none");
    });

  // Hide tooltip whenever mouse moves over the SVG background (not a dot)
  svg.on("mousemove.tooltip", function(event) {
    if (event.target === this || event.target.tagName === "svg" || event.target.classList.contains("state") || event.target.classList.contains("nation")) {
      tooltip.style("display","none");
    }
  });

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.5, 13])
    .on("zoom", (event) => {
      if (!mapGroup) return;
      mapGroup.attr("transform", event.transform);
      const k = event.transform.k;

      // Dot size: grows slowly with zoom
      const primaryR = BASE_R.primary * Math.pow(k, 0.4) / k;
      const secondaryR = BASE_R.secondary * Math.pow(k, 0.4) / k;
      const tertiaryR = BASE_R.tertiary * Math.pow(k, 0.4) / k;
      const regularR = BASE_R.regular * Math.pow(k, 0.4) / k;
      svg.selectAll(".tier-primary").attr("r", primaryR);
      svg.selectAll(".tier-secondary").attr("r", secondaryR);
      svg.selectAll(".tier-tertiary").attr("r", tertiaryR);
      svg.selectAll(".tier-regular").attr("r", regularR);

      // Z-order: after 4th zoom (k >= 4), non-regular cities (PRIMARY, SECONDARY, TERTIARY) appear on top of regular
      if (mapGroup) {
        if (k >= 4) {
          // After 4th zoom: raise primary first, then regular last, so REGULAR is on top
          mapGroup.selectAll(".tier-primary").raise();
          mapGroup.selectAll(".tier-secondary").raise();
          mapGroup.selectAll(".tier-tertiary").raise();
          mapGroup.selectAll(".tier-regular").raise();
        } else {
          // Before 4th zoom: raise regular first, then higher tiers, so PRIMARY is on top (last raised)
          mapGroup.selectAll(".tier-regular").raise();
          mapGroup.selectAll(".tier-tertiary").raise();
          mapGroup.selectAll(".tier-secondary").raise();
          mapGroup.selectAll(".tier-primary").raise();
        }
      }

      svg.selectAll(".state").style("stroke-width", 1.5 / k + "px");
      svg.selectAll(".nation").style("stroke-width", 1.5 / k + "px");
      svg.selectAll(".outer").style("stroke-width", 2.8 / k + "px");

      svg.selectAll(".istate-ghost,.istate-planned").attr("stroke-width", 2.1 / k);
      svg.selectAll(".istate-seg").attr("stroke-width", 2.1 / k);
      svg.selectAll(".istate-preview").attr("stroke-width", 2.5 / k);
      // Shields are drawn in world-space (sizes already /k), so they scale with the transform.
      // Re-render to recompute shield positions at new zoom level.
      if (mapGroup) mapGroup.selectAll(".istate-label,.route-endpoint").remove();
      if (window._shieldRenderPending) clearTimeout(window._shieldRenderPending);
      window._shieldRenderPending = setTimeout(() => {
        if (!mapGroup) return;
        const kNow = d3.zoomTransform(document.getElementById("usa")).k || 1;
        interstates.forEach(ist => {
          if (!ist.visible) return;
          (ist.routeSegs || []).forEach(pts => {
            if (pts.length < 2) return;
            renderShieldsForSeg(ist, pts, kNow);
          });
          // Endpoint dots removed - highways are now selectable at their endpoints
        });
      }, 60);
      
      // Reapply highlights with current zoom level
      if (window.highlightedIstateIds && window.highlightedIstateIds.size > 0 && window.applySearchHighlights) {
        window.applySearchHighlights(k);
      }
      if (window.highlightedCityNames && window.highlightedCityNames.size > 0 && window.applyCityHighlights) {
        window.applyCityHighlights();
      }
      // Update scale bar
      updateScaleBar();
    });

  svg.call(zoom);
  
  // Disable double-click zoom
  svg.on("dblclick.zoom", null);

  // Set initial transform so whole country is visible
  const initScale = 0.85;
  const initX = w * (1 - initScale) / 2;
  const initY = h * (1 - initScale) / 2;
  const initTransform = d3.zoomIdentity.translate(initX, initY).scale(initScale);
  svg.call(zoom.transform, initTransform);

  applyTheme();
  reprojectInterstates();
  loadState();        // restore saved interstates first
  renderInterstates(); // then render with restored data
  initScaleBar();
}

// interstates: { id, number, name, color, rawSegs, routeSegs,
//   plannedRawSegs, plannedRouteSegs,
//   segColors: {idx:{color,label}},   ← click-to-color on OSM route segs
//   customSegments: [{points,rawPoints,color,label}],  ← drawn overlays
//   visible, isCustom }

// ── Re-project on resize ───────────────────────────────────────
function reprojectInterstates() {
  if (!projection) return;
  interstates.forEach(ist => {
    // Each rawSeg is an independent polyline (supports disconnected interstates)
    ist.routeSegs = (ist.rawSegs || []).map(s =>
      s.map(([lon,lat]) => projection([lon,lat])).filter(Boolean)
    ).filter(s => s.length >= 2);
    // chainedPts = all segments flattened (used for segment extraction)
    ist.chainedPts = ist.routeSegs.flat();
    ist.plannedRouteSegs = (ist.plannedRawSegs || []).map(s =>
      s.map(([lon,lat]) => projection([lon,lat])).filter(Boolean)
    ).filter(s => s.length >= 2);
    (ist.customSegments || []).forEach(seg => {
      if (seg.rawPoints)
        seg.points = seg.rawPoints.map(([lon,lat]) => projection([lon,lat])).filter(Boolean);
    });
  });
}

function showPicker(x, y, currentColor, currentLabel) {
  segCustomColor.value = currentColor || "#ff3333";
  segLabelField.value  = currentLabel || "";
  // highlight current color
  swatchGrid.querySelectorAll("div").forEach((d, i) => {
    const isBlack = SWATCH_COLORS[i].hex === "#111111";
    const isSelected = SWATCH_COLORS[i].hex === currentColor;
    d.style.borderColor = isSelected ? "#fff" : (isBlack ? "rgba(255,255,255,0.5)" : "transparent");
  });

}
function hidePicker() {
  segColorPicker.style.display = "none";
  pickerTarget = null;
}
function applySegColor() {
  if (!pickerTarget) return;
  const color = segCustomColor.value;
  const label = segLabelField.value.trim();
  if (pickerTarget.ist && pickerTarget.segIdx === undefined && !pickerTarget.customSeg) {
    // Route-level color
    pickerTarget.ist.color = color;
    renderIstateList();
    // if (typeof buildCustomDropdown === "function" && customDropdown && customDropdown.classList.contains("open")) buildCustomDropdown();
  } else if (pickerTarget.segIdx !== undefined) {
    if (!pickerTarget.ist.segColors) pickerTarget.ist.segColors = {};
    pickerTarget.ist.segColors[pickerTarget.segIdx] = { color, label };
  } else if (pickerTarget.customSeg) {
    pickerTarget.customSeg.color = color;
    if (label) pickerTarget.customSeg.label = label;
  }

// ── Nearest city helper ────────────────────────────────────────
function nearestCity(px, py) {
  let best = null, bestD = Infinity;
  cities.forEach(c => {
    const p = projection([c.lon, c.lat]);
    if (!p) return;
    const d = Math.hypot(p[0]-px, p[1]-py);
    if (d < bestD) { bestD = d; best = c.n; }
  });
  return best;
}
function nearestCityCoords(px, py, maxR) {
  let best = null, bestPt = null, bestD = maxR !== undefined ? maxR : Infinity;
  cities.forEach(c => {
    const p = projection([c.lon, c.lat]);
    if (!p) return;
    const d = Math.hypot(p[0]-px, p[1]-py);
    if (d < bestD) { bestD = d; best = c.n; bestPt = [p[0], p[1]]; }
  });
  return { name: best, pt: bestPt };
}
function snapToCity(px, py, maxR) {
  const r = nearestCityCoords(px, py, maxR);
  return r.pt || null;
}
function segSegIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  // Returns [x,y] if segments AB and CD intersect, else null
  const dxAB = bx-ax, dyAB = by-ay, dxCD = dx-cx, dyCD = dy-cy;
  const denom = dxAB*dyCD - dyAB*dxCD;
  if (Math.abs(denom) < 1e-10) return null;
  const t = ((cx-ax)*dyCD - (cy-ay)*dxCD) / denom;
  const u = ((cx-ax)*dyAB - (cy-ay)*dxAB) / denom;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return [ax + t*dxAB, ay + t*dyAB];
}

// Returns nearest route endpoint (start/end of any visible interstate) within snapR
function nearestRouteEndpoint(px, py, snapR, excludeIstId) {
  let bestPt = null, bestD = snapR, bestLabel = null;
  interstates.forEach(ist => {
    if (!ist.visible) return;
    (ist.routeSegs || []).forEach(seg => {
      if (seg.length < 2) return;
      [seg[0], seg[seg.length - 1]].forEach(ep => {
        const d = Math.hypot(ep[0] - px, ep[1] - py);
        if (d < bestD) {
          bestD = d; bestPt = ep;
          bestLabel = (ist.name || "I-" + ist.number) + " end";
        }
      });
    });
  });
  return bestPt ? { pt: bestPt, label: bestLabel } : null;
}

function nearestIntersection(px, py, snapR, excludeIstId) {
  const currentIst = interstates.find(i => i.id === excludeIstId);
  const currentPts = currentIst ? (currentIst.routeSegs || []).flat() : [];
  if (currentPts.length < 2) return null;

  let bestPt = null, bestD = snapR * 6, bestLabel = null;

  interstates.forEach(other => {
    if (other.id === excludeIstId) return;
    const otherPts = (other.routeSegs || []).flat();
    if (otherPts.length < 2) return;
    const label = "I-" + (other.number || other.name);

    // Check all pairs of segments for geometric crossings
    for (let i = 0; i < currentPts.length - 1; i++) {
      const [ax, ay] = currentPts[i], [bx, by] = currentPts[i+1];
      // Only check segments near the cursor
      const segMidX = (ax+bx)/2, segMidY = (ay+by)/2;
      if (Math.hypot(segMidX-px, segMidY-py) > snapR * 8) continue;
      for (let j = 0; j < otherPts.length - 1; j++) {
        const [cx, cy] = otherPts[j], [dx, dy] = otherPts[j+1];
        if (Math.hypot((cx+dx)/2-px, (cy+dy)/2-py) > snapR * 8) continue;
        const ix = segSegIntersect(ax, ay, bx, by, cx, cy, dx, dy);
        if (!ix) continue;
        const d = Math.hypot(ix[0]-px, ix[1]-py);
        if (d < bestD) { bestD = d; bestPt = ix; bestLabel = label; }
      }
    }
  });
  return bestPt ? { pt: bestPt, label: bestLabel } : null;
}

// ── Route chaining: stitch OSM ways into one continuous polyline ─
function geodist2(a, b) { return (a[0]-b[0])**2 + (a[1]-b[1])**2; }

function chainSegments(rawSegs) {
  if (!rawSegs || rawSegs.length === 0) return [];
  const segs = rawSegs.map(s => s.slice());
  const chains = [segs.shift()];
  const THRESH = 0.02 * 0.02; // ~2km squared in degrees

  while (segs.length > 0) {
    const tail = chains[chains.length - 1];
    const head = tail[0], end = tail[tail.length - 1];
    let bestIdx = -1, bestDist = THRESH, mode = 0;
    segs.forEach((s, i) => {
      const d = [geodist2(s[0], end), geodist2(s[s.length-1], end),
                 geodist2(s[0], head), geodist2(s[s.length-1], head)];
      const m = d.indexOf(Math.min(...d));
      if (d[m] < bestDist) { bestDist = d[m]; bestIdx = i; mode = m; }
    });
    if (bestIdx === -1) { chains.push(segs.shift()); continue; }
    const [seg] = segs.splice(bestIdx, 1);
    if (mode === 0) tail.push(...seg.slice(1));             // append forward
    else if (mode === 1) tail.push(...seg.slice(0,-1).reverse()); // append reversed
    else if (mode === 2) tail.unshift(...seg.slice(0,-1));  // prepend forward
    else tail.unshift(...seg.slice(1).reverse());            // prepend reversed
  }
  // Flatten all chains into one array (chains separated by the longest ones first)
  chains.sort((a,b) => b.length - a.length);
  return chains.flat();
}

// Extract the sub-path along the chained route between two cities
// cityA/cityB are city names; we find the nearest route point geographically
function extractRouteSegment(ist, cityNameA, cityNameB) {
  const route = ist.chainedRoute;
  if (!route || route.length < 2) return null;

  const cityA = cities.find(c => c.n === cityNameA);
  const cityB = cities.find(c => c.n === cityNameB);
  if (!cityA || !cityB) return null;

  let fromIdx = 0, toIdx = 0, fromD = Infinity, toD = Infinity;
  route.forEach(([lon,lat], i) => {
    const d1 = (lon - cityA.lon)**2 + (lat - cityA.lat)**2;
    const d2 = (lon - cityB.lon)**2 + (lat - cityB.lat)**2;
    if (d1 < fromD) { fromD = d1; fromIdx = i; }
    if (d2 < toD)   { toD = d2;   toIdx   = i; }
  });

  if (fromIdx === toIdx) return null;
  if (fromIdx > toIdx) [fromIdx, toIdx] = [toIdx, fromIdx];

  let sub = route.slice(fromIdx, toIdx + 1);
  if (sub.length > 500) {
    const step = Math.ceil(sub.length / 500);
    sub = sub.filter((_,i) => i % step === 0 || i === sub.length-1);
  }
  const pts = sub.map(([lon,lat]) => projection([lon,lat])).filter(Boolean);
  if (pts.length < 2) return null;
  return { rawPoints: sub, points: pts };
}

function loadFromCache(number) {

}

async function fetchInterstateRoute(number, signal, segmentIndex) {
  // 1a. Multi-segment bundled (e.g. I-76 PA vs I-76 CO)
  if (BUNDLED_MULTI[number] !== undefined) {
    const multi = BUNDLED_MULTI[number];
    const idx = segmentIndex !== undefined ? segmentIndex : 0;
    const seg = multi.segments[idx];
    const result = { rawSegs: [seg.coords], plannedRawSegs: [], chainedRoute: seg.coords };
    istateStatus.textContent = `${seg.label} loaded.`;
    return result;
  }
  // 1b. Single bundled route
  if (BUNDLED_ROUTES[number]) {
    const coords = BUNDLED_ROUTES[number];
    const plannedRawSegs = BUNDLED_PLANNED[number] || [];
    const result = { rawSegs: [coords], plannedRawSegs, chainedRoute: coords };
    istateStatus.textContent = `I-${number} loaded.`;
    return result;
  }

  // 2. localStorage cache — instant after first fetch
  const cached = loadFromCache(number);
  if (cached) {
    istateStatus.textContent = `I-${number} loaded (cached).`;
    return cached;
  }

  let elapsed = 0;
  istateStatus.classList.add("loading");
  istateStatus.textContent = `Fetching I-${number}… 0s`;
  clearInterval(loadTimer);
  loadTimer = setInterval(() => {
    elapsed++;
    istateStatus.textContent = `Fetching I-${number}… ${elapsed}s`;
  }, 1000);

  const base = "https://overpass-api.de/api/interpreter?data=";
  const opts = signal ? { signal } : {};

  // Strategy: try relation first (one small response), fall back to way query
  const qRel  = `[out:json][timeout:30];relation["network"="US:I"]["ref"="${number}"];out geom qt;`;
  const qWays = `[out:json][timeout:45];(way["highway"~"motorway|trunk"]["ref"~"(^|[ ;])${number}([ ;]|$)"]["network"~"^US(:I)?$"];way["highway"~"motorway|trunk"]["ref"~"(^|[ ;])I ${number}([ ;]|$)"];);out geom qt;`;
  const qPlan = `[out:json][timeout:20];(way["highway"~"construction|proposed"]["ref"~"(^|[ ;])I[ -]?${number}([ ;]|$)"];way["construction"="motorway"]["ref"~"(^|[ ;])I[ -]?${number}([ ;]|$)"];);out geom qt;`;

  try {
    // Fire planned query in parallel while we try the faster relation query
    const planPromise = fetch(base + encodeURIComponent(qPlan), opts)
      .then(r => r.json()).catch(() => ({elements:[]}));

    // Try relation first — usually much smaller response
    let relData = await fetch(base + encodeURIComponent(qRel), opts)
      .then(r => r.json()).catch(() => ({elements:[]}));

    clearInterval(loadTimer); istateStatus.classList.remove("loading");

    const rawSegs = [], plannedRawSegs = [];

    for (const el of relData.elements) {
      if (el.type === "relation") {
        for (const m of el.members)
          if (m.type === "way" && m.geometry?.length >= 2)
            rawSegs.push(m.geometry.map(({lat,lon}) => [lon,lat]));
      }
    }

    // Fall back to way query if relation returned nothing
    if (rawSegs.length === 0) {
      istateStatus.classList.add("loading");
      istateStatus.textContent = `Fetching I-${number} (ways)… `;
      const wayData = await fetch(base + encodeURIComponent(qWays), opts)
        .then(r => r.json()).catch(() => ({elements:[]}));
      clearInterval(loadTimer); istateStatus.classList.remove("loading");
      for (const el of wayData.elements)
        if (el.type === "way" && el.geometry?.length >= 2)
          rawSegs.push(el.geometry.map(({lat,lon}) => [lon,lat]));
    }

    // Collect planned segments
    const planData = await planPromise;
    for (const el of planData.elements)
      if (el.type === "way" && el.geometry?.length >= 2)
        plannedRawSegs.push(el.geometry.map(({lat,lon}) => [lon,lat]));

    if (rawSegs.length === 0 && plannedRawSegs.length === 0) {
      istateStatus.textContent = `No data for I-${number}.`; return null;
    }

    const chainedRoute = chainSegments(rawSegs);
    const extra = plannedRawSegs.length ? ` + planned gaps` : "";
    istateStatus.textContent = `I-${number} loaded${extra}.`;
    const result = { rawSegs, plannedRawSegs, chainedRoute };
    saveToCache(number, result);
    return result;
  } catch(e) {
    clearInterval(loadTimer); istateStatus.classList.remove("loading");
    if (e.name === "AbortError") throw e;
    istateStatus.textContent = `Error: ${e.message}`; return null;
  }
}

// ── Interstate shield renderer (custom highways only) ─────────
function renderShieldsForSeg(ist, pts, k) {
  // Only render text labels for custom highways — interstates have no labels
  if (!ist.isCustom) return;
  const LABEL_SPACING = 200 / k;
  let arcLen = 0, nextLabel = LABEL_SPACING / 2;
  for (let li = 1; li < pts.length; li++) {
    const dx = pts[li][0] - pts[li-1][0], dy = pts[li][1] - pts[li-1][1];
    const segLen = Math.hypot(dx, dy);
    const prevArc = arcLen;
    arcLen += segLen;
    while (nextLabel <= arcLen) {
      const t = (nextLabel - prevArc) / segLen;
      const lx = pts[li-1][0] + t * dx;
      const ly = pts[li-1][1] + t * dy;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      const rot = (angle > 90 || angle < -90) ? angle + 180 : angle;
      mapGroup.append("text")
        .attr("class","istate-label")
        .attr("x", lx).attr("y", ly)
        .attr("text-anchor","middle").attr("dominant-baseline","middle")
        .attr("font-size", 11 / k)
        .attr("stroke", ist.color).attr("stroke-width", 3 / k)
        .attr("fill","white")
        .attr("transform", `rotate(${rot},${lx},${ly})`)
        .text(ist.name);
      nextLabel += LABEL_SPACING;
    }
  }
}

// ── Render all highways ────────────────────────────────────────
function renderInterstates() {
  if (!mapGroup) return;
  mapGroup.selectAll(".istate-ghost,.istate-planned,.istate-seg,.istate-preview,.istate-ref-hit,.istate-ref-vis,.istate-label,.route-endpoint").remove();

  const k = d3.zoomTransform(document.getElementById("usa")).k || 1;

  interstates.forEach(ist => {
    if (!ist.visible) return;

    // Ghost route — one path per segment (supports disconnected routes)
    (ist.routeSegs || []).forEach((pts, segIdx) => {
      if (pts.length < 2) return;
      mapGroup.insert("path", ".city-dot")
        .attr("class","istate-ghost")
        .attr("data-istate-id", ist.id)
        .attr("d", d3.line()(pts))
        .attr("fill","none").attr("stroke", ist.color)
        .attr("stroke-width", 2.1 / k).attr("stroke-linecap","round")
        .attr("stroke-linejoin","round").attr("opacity", 0.7);

      // Interstate shields: place every ~200 world-units, scale with zoom
      renderShieldsForSeg(ist, pts, k);

      // Endpoint dots removed - highways are now selectable at their endpoints
    });

    // Planned/future gaps — dashed
    (ist.plannedRouteSegs || []).forEach(seg => {
      if (seg.length < 2) return;
      mapGroup.insert("path", ".city-dot")
        .attr("class","istate-planned")
        .attr("data-istate-id", ist.id)
        .attr("d", d3.line()(seg))
        .attr("fill","none").attr("stroke", ist.color)
        .attr("stroke-width", 2.1).attr("stroke-linecap","round")
        .attr("stroke-dasharray","8,6").attr("opacity",0.35);
    });

    // City-to-city colored segments (bright, on top)
    const showBlack = !!ist.fullySegmented;
    (ist.customSegments || []).forEach(seg => {
      if (!seg.points || seg.points.length < 2) return;
      mapGroup.insert("path", ".city-dot")
        .attr("class","istate-seg")
        .attr("data-istate-id", ist.id)
        .attr("d", d3.line()(seg.points))
        .attr("fill","none").attr("stroke", showBlack ? "#000000" : (seg.color || ist.color))
        .attr("stroke-width", 2.1).attr("stroke-linecap","round")
        .attr("stroke-linejoin","round").attr("opacity", 1);
    });
  });

  renderIstateList();
  // renderCustomList(); // Custom highways removed
  renderFavList();
  saveState();
  syncSidebarFromInterstates();
  
  if (window.highlightedIstateIds && window.highlightedIstateIds.size > 0) {
    setTimeout(() => { window.applySearchHighlights(); }, 10);
  }
  if (window.highlightedCityNames && window.highlightedCityNames.size > 0) {
    setTimeout(() => { window.applyCityHighlights(); }, 10);
  }
}

// ── Preview while drawing ──────────────────────────────────────
function renderPreview() {
  if (!mapGroup || !drawMode) return;
  mapGroup.selectAll(".istate-preview").remove();
  const ist   = interstates.find(i => i.id === drawMode.istateId);
  const color = ist?.color || "#aaaaaa";
  if (drawMode.points.length >= 2) {
    mapGroup.append("path").attr("class","istate-preview")
      .attr("d", d3.line()(drawMode.points))
      .attr("fill","none").attr("stroke",color).attr("stroke-width",2.5)
      .attr("stroke-linecap","round").attr("opacity",0.85);
  }
  drawMode.points.forEach(pt => {
    mapGroup.append("circle").attr("class","istate-preview")
      .attr("cx",pt[0]).attr("cy",pt[1]).attr("r",3)
      .attr("fill",color).attr("opacity",0.95);
  });
}

// ── State persistence ──────────────────────────────────────────
const STATE_KEY = "waypoint_map_istates_v7";
function saveState() {
  try {
    const data = interstates.map(ist => ({
      id: ist.id, number: ist.number, name: ist.name, color: ist.color,
      rawSegs: ist.rawSegs, plannedRawSegs: ist.plannedRawSegs,
      chainedRoute: ist.chainedRoute, fullySegmented: ist.fullySegmented,
      favorite: ist.favorite || false,
      customSegments: (ist.customSegments||[]).map(s => ({
        id: s.id, rawPoints: s.rawPoints, color: s.color, label: s.label, status: s.status, notes: s.notes || ""
      })),
      visible: ist.visible, isCustom: ist.isCustom
    }));
    localStorage.setItem(STATE_KEY, JSON.stringify(data));
  } catch(e) {}
}
function loadState() {
  try {
    const s = localStorage.getItem(STATE_KEY);
    if (!s) return;
    const raw = JSON.parse(s);

    // Deduplicate non-custom by number — keep the one with most custom segments
    const seen = new Set();
    const deduped = raw.filter(d => {
      if (d.isCustom) return true;
      if (seen.has(d.number)) return false;
      seen.add(d.number);
      return true;
    });

    interstates = deduped.map(d => ({
      ...d,
      routeSegs: [], plannedRouteSegs: [], chainedPts: [],
      segColors: {},
      customSegments: (d.customSegments||[]).map(s => ({...s, points:[]}))
    }));
    reprojectInterstates();
    // Restore checkbox states in dropdown
    interstates.forEach(ist => {
      if (!ist.number) return;
      const itemEl = document.getElementById("sb-item-" + ist.number);
      if (itemEl) {
        const cb = itemEl.querySelector("input[type=checkbox]");
        if (cb) cb.checked = true;
        itemEl.classList.add("active");
        const statusEl = itemEl.querySelector(".sb-status");
        if (statusEl) statusEl.textContent = "✓";
        const swatchEl = itemEl.querySelector(".sb-swatch");
        if (swatchEl) swatchEl.style.background = ist.color;
      }
    });
  } catch(e) {}
}

function makeIstateRow(ist, container) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "border-bottom:1px solid var(--ip-border,#1a3a1a);";
  const row = document.createElement("div");
  row.className = "istate-item";
  const hasOsmRoute = (ist.chainedRoute || []).length > 0;
  const drawBtn = ist.isCustom && !hasOsmRoute
    ? `<button class="istate-btn" data-action="drawroute">✎ Route</button>`
    : `<button class="istate-btn" data-action="seg">＋ Seg</button>`;
  const favClass = ist.favorite ? "fav-star active" : "fav-star";
  row.innerHTML = `
    <button class="${favClass}" data-action="fav" title="Favorite">★</button>
    <input class="istate-name-edit" value="${ist.name}" title="Click to rename" />
    <span class="istate-color-swatch" title="Color" style="display:inline-block;width:14px;height:14px;border-radius:2px;background:${ist.color};cursor:pointer;border:1px solid rgba(255,255,255,0.3);flex-shrink:0;"></span>
    <button class="istate-btn" data-action="toggle">${ist.visible ? "◉" : "○"}</button>
    ${drawBtn}
    <button class="istate-btn del" data-action="del">✕</button>`;
  row.querySelector(".istate-name-edit").addEventListener("change", e => { ist.name = e.target.value; saveState(); });
  row.querySelector("[data-action=toggle]").addEventListener("click", () => { ist.visible = !ist.visible; renderInterstates(); });
  row.querySelector("[data-action=del]").addEventListener("click", () => { interstates = interstates.filter(i => i.id !== ist.id); renderInterstates(); });
  row.querySelector("[data-action=fav]").addEventListener("click", () => {
    ist.favorite = !ist.favorite;
    saveState();
    renderIstateList();
    // renderCustomList(); // Custom highways removed
    renderFavList();
  });
  row.querySelector(".istate-color-swatch").addEventListener("click", e => {
    e.stopPropagation();
    pickerTarget = { ist };
    showPicker(e.clientX, e.clientY, ist.color, "");
    segLabelField.style.display = "none";
    segApplyBtn.style.display = "none";
  });
  const segBtn   = row.querySelector("[data-action=seg]");
  const routeBtn = row.querySelector("[data-action=drawroute]");
  if (segBtn)   segBtn.addEventListener("click",   () => startDrawMode(ist.id, "segment"));
  if (routeBtn) routeBtn.addEventListener("click", () => startDrawMode(ist.id, "route"));
  wrap.appendChild(row);
  (ist.customSegments || []).forEach((seg, idx) => {
    const sr = document.createElement("div");
    sr.className = "seg-item";
    const status = seg.status || "not-built";
    const statusColor = status === "complete" ? "#00ff00" : status === "in-progress" ? "#ffff00" : "#ff0000";
    sr.innerHTML = `
      <span class="seg-label">${seg.label || `Seg ${idx+1}`}</span>
      <select class="seg-status-select" style="background:${statusColor};color:#000;border:1px solid rgba(255,255,255,0.3);border-radius:2px;padding:2px;font-size:10px;cursor:pointer;">
        <option value="not-built" ${status === "not-built" ? "selected" : ""}>Not Built</option>
        <option value="in-progress" ${status === "in-progress" ? "selected" : ""}>In Progress</option>
        <option value="complete" ${status === "complete" ? "selected" : ""}>Complete</option>
      </select>
      <button class="istate-btn del">✕</button>
      <textarea class="seg-notes" rows="1" placeholder="Notes...">${(seg.notes || "").replace(/</g,"&lt;")}</textarea>`;
    const notesEl = sr.querySelector(".seg-notes");
    notesEl.addEventListener("input", e => {
      seg.notes = e.target.value;
      e.target.style.height = "auto";
      e.target.style.height = e.target.scrollHeight + "px";
      saveState();
    });
    setTimeout(() => { if (notesEl.value) { notesEl.style.height = "auto"; notesEl.style.height = notesEl.scrollHeight + "px"; } }, 0);
    sr.querySelector(".seg-status-select").addEventListener("change", e => {
      e.stopPropagation();
      const newStatus = e.target.value;
      seg.status = newStatus;
      seg.color = newStatus === "complete" ? "#00ff00" : newStatus === "in-progress" ? "#ffff00" : "#ff0000";
      e.target.style.background = seg.color;
      
      renderInterstates();
    });
    sr.querySelector("button").addEventListener("click", () => { ist.customSegments.splice(idx,1); renderInterstates(); });
    wrap.appendChild(sr);
  });
  
  // Add "Fully Complete" checkbox if there are segments
  if ((ist.customSegments || []).length > 0) {
    const fsRow = document.createElement("div");
    fsRow.style.cssText = "padding:4px 10px 4px 22px;font-size:10px;opacity:0.8;display:flex;align-items:center;gap:5px;";
    const checked = ist.fullySegmented ? "checked" : "";
    fsRow.innerHTML = `
      <input type="checkbox" id="fs-${ist.id}" ${checked} style="cursor:pointer;">
      <label for="fs-${ist.id}" style="cursor:pointer;">Fully Complete</label>`;
    fsRow.querySelector("input").addEventListener("change", e => {
      ist.fullySegmented = e.target.checked;
      ist.color = ist.fullySegmented ? "#000000" : "#ff3333";
      renderInterstates();
    });
    wrap.appendChild(fsRow);
  }
  
  container.appendChild(wrap);
}

function renderIstateList() {
  istateListEl.innerHTML = "";
  interstates.filter(i => !i.isCustom)
    .slice().sort((a, b) => {
      const na = parseInt(a.number) || 0, nb = parseInt(b.number) || 0;
      if (na !== nb) return na - nb;
      return String(a.number).localeCompare(String(b.number));
    })
    .forEach(ist => makeIstateRow(ist, istateListEl));
}

function renderFavList() {
  const favDD = document.getElementById("fav-dropdown");
  if (!favDD) return;
  const favs = interstates.filter(i => i.favorite);
  // Clear existing items (keep only non-item children if any)
  favDD.innerHTML = "";
  if (favs.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:8px 12px;font-size:10px;opacity:0.5;";
    empty.textContent = "No favorites yet — click ★ on any route";
    favDD.appendChild(empty);
    return;
  }
  favs.forEach(ist => {
    const item = document.createElement("div");
    item.className = "fav-dd-item";
    const dot = document.createElement("span");
    dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;background:${ist.color};flex-shrink:0;`;
    const name = document.createElement("span");
    name.style.flex = "1";
    const segs = (ist.customSegments || []).length;
    const complete = (ist.customSegments || []).filter(s => s.status === "complete").length;
    const progress = segs > 0 ? ` (${complete}/${segs})` : "";
    name.textContent = ist.name + progress;
    const unstar = document.createElement("button");
    unstar.className = "fav-dd-unstar";
    unstar.title = "Remove from favorites";
    unstar.textContent = "★";
    unstar.addEventListener("click", e => {
      e.stopPropagation();
      ist.favorite = false;
      saveState();
      renderIstateList();
      // renderCustomList(); // Custom highways removed
      renderFavList();
    });
    item.appendChild(dot);
    item.appendChild(name);
    item.appendChild(unstar);
    item.addEventListener("click", (e) => {
      if (e.target === unstar) return;
      ist.visible = true;
      renderInterstates();
    });
    favDD.appendChild(item);
  });
}

istateFetchBtn.addEventListener("click", async () => {
  const num = istateInput.value.trim().replace(/^[iI]-?/,"");
  if (!num) { istateInput.focus(); return; }

  // Multi-segment interstate — combined loads all at once, otherwise show picker
  if (BUNDLED_MULTI[num]) {
    const multi = BUNDLED_MULTI[num];
    if (multi.combined) {
      const combinedKey = "multi_" + num + "_combined";
      if (!interstates.find(i => i.multiKey === combinedKey)) {
        const allCoords = multi.segments.map(s => s.coords);
        interstates.push({
          id: Date.now() + Math.random(), number: num, name: multi.label || ("I-" + num),
          color: nextColor(), rawSegs: allCoords, routeSegs: [], plannedRawSegs: [], plannedRouteSegs: [],
          chainedRoute: allCoords[0], multiKey: combinedKey,
          segColors: {}, customSegments: [], visible: true, isCustom: false
        });
        reprojectInterstates();
        renderInterstates();
      }
      istateInput.value = "";
      return;
    }
    showMultiPicker(num);
    istateInput.value = "";
    return;
  }

  if (interstates.find(i => i.number === num && !i.isCustom && !i.multiKey)) {
    istateStatus.textContent = `I-${num} already loaded.`; return;
  }
  istateFetchBtn.disabled = true;
  const result = await fetchInterstateRoute(num);
  istateFetchBtn.disabled = false;
  if (!result) return;
  interstates.push({
    id: Date.now(), number: num, name: `I-${num}`, color: nextColor(),
    rawSegs: result.rawSegs, routeSegs: [],
    plannedRawSegs: result.plannedRawSegs, plannedRouteSegs: [],
    chainedRoute: result.chainedRoute,
    segColors: {}, customSegments: [], visible: true, isCustom: false
  });
  reprojectInterstates();
  istateInput.value = "";
  renderInterstates();
});

function showMultiPicker(num) {
  const multi = BUNDLED_MULTI[num];
  const th = themes[currentTheme] || themes.matrix;
  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;";
  const box = document.createElement("div");
  box.style.cssText = `background:${th.panelBg};border:1px solid ${th.panelBorder};border-radius:5px;padding:14px 16px;font-family:monospace;color:${th.panelFg};min-width:260px;box-shadow:0 6px 24px rgba(0,0,0,0.5);`;
  box.innerHTML = `<div style="font-size:12px;font-weight:bold;margin-bottom:10px;letter-spacing:0.5px;">I-${num} — select a segment:</div>`;
  multi.segments.forEach((seg, idx) => {
    const alreadyLoaded = !!interstates.find(i => i.multiKey === num + "_" + idx);
    const btn = document.createElement("button");
    btn.textContent = (alreadyLoaded ? "✓ " : "") + seg.label;
    btn.disabled = alreadyLoaded;
    btn.style.cssText = `display:block;width:100%;margin-bottom:6px;padding:7px 10px;background:${alreadyLoaded ? th.panelBorder : "transparent"};border:1px solid ${th.panelBorder};border-radius:3px;color:${alreadyLoaded ? th.panelFg+"99" : th.panelFg};font-family:monospace;font-size:11px;cursor:${alreadyLoaded?"default":"pointer"};text-align:left;transition:filter 0.1s;`;
    if (!alreadyLoaded) btn.addEventListener("mouseover", () => btn.style.filter = "brightness(1.4)");
    if (!alreadyLoaded) btn.addEventListener("mouseout",  () => btn.style.filter = "");
    btn.addEventListener("click", () => {
      if (alreadyLoaded) return;
      document.body.removeChild(modal);
      handleSidebarCheckMulti(num, idx, true);
      const cb = document.getElementById("sb-cb-" + num + "_" + idx);
      if (cb) cb.checked = true;
    });
    box.appendChild(btn);
  });
  const cancel = document.createElement("button");
  cancel.textContent = "Cancel";
  cancel.style.cssText = `display:block;width:100%;padding:5px;margin-top:4px;background:transparent;border:1px solid ${th.panelBorder};border-radius:3px;color:${th.panelFg};opacity:0.6;font-family:monospace;font-size:11px;cursor:pointer;`;
  cancel.addEventListener("click", () => document.body.removeChild(modal));
  box.appendChild(cancel);
  modal.appendChild(box);
  modal.addEventListener("click", e => { if (e.target === modal) document.body.removeChild(modal); });
  document.body.appendChild(modal);
}

// ── Undo / Save / Cancel ───────────────────────────────────────
function doSaveDraw() {
  if (drawMode && drawMode.points.length >= 2) {
    const ist = interstates.find(i => i.id === drawMode.istateId);
    if (ist) {
      if (drawMode.type === "route") {
        const rawPoints = drawMode.points.map(pt => {
          const ll = projection.invert(pt); return ll ? [ll[0],ll[1]] : null;
        }).filter(Boolean);
        ist.rawSegs = [rawPoints];
        ist.chainedRoute = rawPoints;
        reprojectInterstates();
      } else {
        const first = drawMode.points[0], last = drawMode.points[drawMode.points.length-1];
        const snapLabels = drawMode.snapLabels || [];
        const fromLabel = snapLabels[0] || null;
        const toLabel   = snapLabels[1] || null;
        const label = (fromLabel && toLabel && fromLabel !== toLabel)
          ? `${fromLabel} → ${toLabel}`
          : (fromLabel || toLabel || "Segment");

        // Build segment by finding nearest position on the projected route
        const allRoutePts = ist.chainedPts && ist.chainedPts.length >= 2
          ? ist.chainedPts
          : (ist.routeSegs || []).flat();

        let segPoints = null, segRaw = null;

        if (allRoutePts.length >= 2) {
          // Find closest point on the polyline (not just vertices) for first and last click
          function closestOnPolyline(px, py, pts) {
            let bestT = 0, bestDist = Infinity, bestIdx = 0;
            for (let i = 0; i < pts.length - 1; i++) {
              const ax = pts[i][0], ay = pts[i][1];
              const bx = pts[i+1][0], by = pts[i+1][1];
              const dx = bx - ax, dy = by - ay;
              const lenSq = dx*dx + dy*dy;
              let t = lenSq > 0 ? ((px-ax)*dx + (py-ay)*dy) / lenSq : 0;
              t = Math.max(0, Math.min(1, t));
              const cx = ax + t*dx, cy = ay + t*dy;
              const d = Math.hypot(px-cx, py-cy);
              if (d < bestDist) { bestDist = d; bestT = t; bestIdx = i; }
            }
            // Return the fractional index (bestIdx + bestT) and the snapped point
            return { idx: bestIdx, t: bestT, frac: bestIdx + bestT,
                     pt: [pts[bestIdx][0] + bestT*(pts[bestIdx+1][0]-pts[bestIdx][0]),
                          pts[bestIdx][1] + bestT*(pts[bestIdx+1][1]-pts[bestIdx][1])] };
          }

          const snapA = closestOnPolyline(first[0], first[1], allRoutePts);
          const snapB = closestOnPolyline(last[0],  last[1],  allRoutePts);

          let fA = snapA.frac, fB = snapB.frac;
          if (fA > fB) { [fA, fB] = [fB, fA]; [snapA.idx, snapB.idx] = [snapB.idx, snapA.idx]; [snapA.t, snapB.t] = [snapB.t, snapA.t]; [snapA.pt, snapB.pt] = [snapB.pt, snapA.pt]; }

          // Build sub-path: start snap point → intermediate vertices → end snap point
          const sub = [snapA.pt];
          for (let i = snapA.idx + 1; i <= snapB.idx; i++) sub.push(allRoutePts[i]);
          sub.push(snapB.pt);

          if (sub.length >= 2) {
            segPoints = sub;
            segRaw = segPoints.map(pt => { const ll = projection.invert(pt); return ll ? [ll[0],ll[1]] : null; }).filter(Boolean);
          }
        }

        // Fallback: straight line
        if (!segPoints || segPoints.length < 2) {
          segPoints = [first, last];
          segRaw = segPoints.map(pt => { const ll = projection.invert(pt); return ll ? [ll[0],ll[1]] : null; }).filter(Boolean);
        }

        ist.customSegments.push({ id: Date.now(), points: segPoints, rawPoints: segRaw, color: "#ff0000", status: "not-built", label });
      }
    }
  }
  cancelDraw();
  renderInterstates();
}

// ── Map click: place draw point — snaps to nearest city ───────
document.getElementById("usa").addEventListener("click", function(event) {
  if (!drawMode) return;
  const transform = d3.zoomTransform(this);
  const screenPt = d3.pointer(event, this);
  const [mx, my] = transform.invert(screenPt);

  if (drawMode.type === "segment") {
    const snapR = 24 / transform.k;  // world-space snap radius

    // City snap: compare in screen space for accuracy
    let citySnapPt = null, citySnapName = null;
    let bestCityD = 30; // screen pixels
    cities.forEach(c => {
      const p = projection([c.lon, c.lat]);
      if (!p) return;
      // Convert world-space projected point to screen space
      const sx = p[0] * transform.k + transform.x;
      const sy = p[1] * transform.k + transform.y;
      const d = Math.hypot(sx - screenPt[0], sy - screenPt[1]);
      if (d < bestCityD) { bestCityD = d; citySnapName = c.n; citySnapPt = p; }
    });

    const ix = nearestIntersection(mx, my, snapR, drawMode.istateId);
    const ep = !ix ? nearestRouteEndpoint(mx, my, snapR * 2, drawMode.istateId) : null;

    // Priority: intersection > endpoint > city > raw
    const pt  = ix ? ix.pt  : (ep ? ep.pt  : (citySnapPt  || [mx, my]));
    const lbl = ix ? ix.label : (ep ? ep.label : (citySnapName || null));

    if (drawMode.points.length === 0) {
      drawMode.points.push(pt);
      drawMode.snapLabels = [lbl];
    } else if (drawMode.points.length === 1) {
      const first = drawMode.points[0];
      const firstLbl = drawMode.snapLabels?.[0];
      if (firstLbl !== lbl || Math.hypot(pt[0]-first[0], pt[1]-first[1]) > 5) {
        drawMode.points.push(pt);
        drawMode.snapLabels = [firstLbl, lbl];
        renderPreview();
        doSaveDraw();
        return;
      } else {
        istateStatus.textContent = "Pick a different endpoint.";
        setTimeout(() => { if (!drawMode) return; istateStatus.textContent = ""; }, 1500);
      }
    }
  } else {
    // Route drawing — free placement
    drawMode.points.push([mx,my]);
  }
  renderPreview();
});
// ── Mousemove: show snap ring on nearest intersection or city ──
document.getElementById("usa").addEventListener("mousemove", function(event) {
  mapGroup.selectAll(".snap-ring").remove();
  if (!drawMode || drawMode.type !== "segment") return;
  const transform = d3.zoomTransform(this);
  const screenPt = d3.pointer(event, this);
  const [mx,my] = transform.invert(screenPt);
  const k = transform.k;
  const snapR = 24 / k;
  const ix = nearestIntersection(mx, my, snapR, drawMode.istateId);
  if (ix) {
    const s = 8 / k;
    mapGroup.append("path").attr("class","snap-ring")
      .attr("d", `M${ix.pt[0]},${ix.pt[1]-s} L${ix.pt[0]+s},${ix.pt[1]} L${ix.pt[0]},${ix.pt[1]+s} L${ix.pt[0]-s},${ix.pt[1]} Z`)
      .attr("fill","none").attr("stroke","#ffee00").attr("stroke-width", 1.5/k)
      .attr("opacity",0.9).style("pointer-events","none");
    return;
  }
  const ep = nearestRouteEndpoint(mx, my, snapR * 2, drawMode.istateId);
  if (ep) {
    const s = 8 / k;
    mapGroup.append("path").attr("class","snap-ring")
      .attr("d", `M${ep.pt[0]},${ep.pt[1]-s} L${ep.pt[0]+s},${ep.pt[1]} L${ep.pt[0]},${ep.pt[1]+s} L${ep.pt[0]-s},${ep.pt[1]} Z`)
      .attr("fill","none").attr("stroke","#aaffaa").attr("stroke-width", 1.5/k)
      .attr("opacity",0.85).style("pointer-events","none");
    return;
  }
  // City snap in screen space
  let bestCityPt = null, bestCityD = 30;
  cities.forEach(c => {
    const p = projection([c.lon, c.lat]);
    if (!p) return;
    const sx = p[0] * k + transform.x;
    const sy = p[1] * k + transform.y;
    const d = Math.hypot(sx - screenPt[0], sy - screenPt[1]);
    if (d < bestCityD) { bestCityD = d; bestCityPt = p; }
  });
  if (!bestCityPt) return;
  mapGroup.append("circle").attr("class","snap-ring")
    .attr("cx", bestCityPt[0]).attr("cy", bestCityPt[1])
    .attr("r", 10 / k)
    .attr("fill","none").attr("stroke","#fff").attr("stroke-width", 1.5/k)
    .attr("stroke-dasharray", `${3/k},${2/k}`).attr("opacity",0.7)
    .style("pointer-events","none");
});

// Fetch queue — max 2 concurrent
const fetchQueue = [];
let activeFetches = 0;
const MAX_CONCURRENT = 2;
const abortControllers = {}; // number -> AbortController

function enqueueFetch(number) {
  fetchQueue.push(number);
  drainQueue();
}

function drainQueue() {
  while (activeFetches < MAX_CONCURRENT && fetchQueue.length > 0) {
    const num = fetchQueue.shift();
    activeFetches++;
    sidebarFetchInterstate(num).finally(() => {
      activeFetches--;
      drainQueue();
    });
  }
  updateSidebarStatus();
}

function cancelFetch(number) {
  // Remove from queue if pending
  const idx = fetchQueue.indexOf(number);
  if (idx !== -1) fetchQueue.splice(idx, 1);
  // Abort if in-flight
  if (abortControllers[number]) {
    abortControllers[number].abort();
    delete abortControllers[number];
  }
}

function updateSidebarStatus() {
  const pending = fetchQueue.length;
  const active  = activeFetches;
  // Show the names of currently-fetching interstates
  const activeNums = Object.keys(abortControllers);
  if (active === 0 && pending === 0) {
    dropdownStatus.textContent = "";
  } else {
    const nameStr = activeNums.map(n => `I-${n}`).join(", ");
    const queueStr = pending > 0 ? ` (${pending} queued)` : "";
    dropdownStatus.textContent = `Loading ${nameStr || "…"}${queueStr}`;
  }
}

async function sidebarFetchInterstate(number) {
  const numStr = String(number);
  const itemEl = document.getElementById("sb-item-" + numStr);
  const statusEl = itemEl?.querySelector(".sb-status");
  const swatchEl = itemEl?.querySelector(".sb-swatch");
  if (statusEl) { statusEl.textContent = "\u2026"; statusEl.classList.add("loading"); }

  const ac = new AbortController();
  abortControllers[numStr] = ac;
  try {
    const result = await fetchInterstateRoute(numStr, ac.signal);
    delete abortControllers[numStr];
    if (!result) {      // Fetch failed or returned empty — uncheck the checkbox
      const cb = itemEl?.querySelector("input[type=checkbox]");
      if (cb) cb.checked = false;
      if (statusEl) { statusEl.textContent = "\u2717"; statusEl.classList.remove("loading"); }
      if (itemEl) itemEl.classList.remove("active");
      return;
    }
    const color = nextColor();
    // Don't add if already present (e.g. loaded from saved state before fetch returned)
    if (!interstates.find(i => i.number === numStr && !i.isCustom)) {
      interstates.push({
        id: Date.now() + Math.random(),
        number: numStr, name: `I-${numStr}`, color,
        rawSegs: result.rawSegs, routeSegs: [],
        plannedRawSegs: result.plannedRawSegs || [], plannedRouteSegs: [],
        chainedRoute: result.chainedRoute || [],
        segColors: {}, customSegments: [], visible: true, isCustom: false
      });
      reprojectInterstates();
    }
    if (swatchEl) { swatchEl.style.background = color; }
    if (statusEl) { statusEl.textContent = "\u2713"; statusEl.classList.remove("loading"); }
    if (itemEl) itemEl.classList.add("active");
    renderInterstates();
  } catch (e) {
    delete abortControllers[numStr];
    if (e.name === "AbortError") {
      if (statusEl) { statusEl.textContent = ""; statusEl.classList.remove("loading"); }
      return;
    }
    const cb = itemEl?.querySelector("input[type=checkbox]");
    if (cb) cb.checked = false;
    if (statusEl) { statusEl.textContent = "\u2717"; statusEl.classList.remove("loading"); }
    if (itemEl) itemEl.classList.remove("active");
  }
  updateSidebarStatus();
}

function handleSidebarCheckMulti(numStr, segIdx, checked) {
  const segKey = numStr + "_" + segIdx;
  const seg = BUNDLED_MULTI[numStr].segments[segIdx];
  const existing = interstates.find(i => i.multiKey === segKey);
  if (checked) {
    if (existing) {
      existing.visible = true; renderInterstates();
    } else {
      // Fetch and add this specific segment
      const result = { rawSegs: [seg.coords], plannedRawSegs: [], chainedRoute: seg.coords };
      interstates.push({
        id: Date.now() + Math.random(), number: numStr, name: seg.label, color: nextColor(),
        rawSegs: result.rawSegs, routeSegs: [], plannedRawSegs: [], plannedRouteSegs: [],
        chainedRoute: result.chainedRoute, multiKey: segKey,
        segColors: {}, customSegments: [], visible: true, isCustom: false
      });
      reprojectInterstates(); renderInterstates();
    }
    const item = document.getElementById("sb-item-" + segKey);
    if (item) {
      item.classList.add("active");
      const sw = item.querySelector(".sb-swatch");
      const ist = interstates.find(i => i.multiKey === segKey);
      if (sw && ist) sw.style.background = ist.color;
      const st = item.querySelector(".sb-status");
      if (st) st.textContent = "✓";
    }
  } else {
    if (existing) {
      interstates = interstates.filter(i => i.multiKey !== segKey);
      renderInterstates();
    }
    const item = document.getElementById("sb-item-" + segKey);
    if (item) {
      item.classList.remove("active");
      const sw = item.querySelector(".sb-swatch"); if (sw) sw.style.background = "";
      const st = item.querySelector(".sb-status"); if (st) st.textContent = "";
    }
  }
}

function handleSidebarCheck(number, checked) {
  const numStr = String(number);
  const existing = interstates.find(i => i.number === numStr && !i.isCustom);
  if (checked) {
    if (existing) {
      existing.visible = true;
      renderInterstates();
      const itemEl = document.getElementById("sb-item-" + numStr);
      if (itemEl) itemEl.classList.add("active");
      const statusEl = itemEl?.querySelector(".sb-status");
      if (statusEl) { statusEl.textContent = "✓"; statusEl.classList.remove("loading"); }
    } else {
      // Only enqueue if not already being fetched
      if (!abortControllers[numStr] && !fetchQueue.includes(number)) {
        enqueueFetch(number);
      }
    }
  } else {
    cancelFetch(number);
    if (existing) {
      interstates = interstates.filter(i => !(i.number === numStr && !i.isCustom));
      renderInterstates();
    }
    const itemEl = document.getElementById("sb-item-" + numStr);
    if (itemEl) itemEl.classList.remove("active");
    const statusEl = itemEl?.querySelector(".sb-status");
    if (statusEl) { statusEl.textContent = ""; statusEl.classList.remove("loading"); }
    const swatchEl = itemEl?.querySelector(".sb-swatch");
    if (swatchEl) swatchEl.style.background = "";
  }
}

function buildDropdown() {
  dropdownContent.innerHTML = "";
  ALL_INTERSTATES.forEach(num => {
    const numStr = String(num);
    const multi = BUNDLED_MULTI[numStr];

    if (multi) {
      // One checkbox row per named segment
      multi.segments.forEach((seg, idx) => {
        const segKey = numStr + "_" + idx;

        item.appendChild(cb); item.appendChild(lbl); item.appendChild(swatch); item.appendChild(status);

      item.id = "sb-item-" + numStr;
      const cb = document.createElement("input");
      cb.type = "checkbox";

      item.appendChild(cb); item.appendChild(lbl); item.appendChild(swatch); item.appendChild(status);
      dropdownContent.appendChild(item);
    }
  });
}

function buildSegDropdown() {
  segDropdownEl.innerHTML = "";

    .filter(i => (i.customSegments || []).length > 0 || (!i.isCustom && i.rawSegs && i.rawSegs.length > 0) || i.isCustom)
    .sort((a, b) => {
      const na = parseInt(a.number) || Infinity;
      const nb = parseInt(b.number) || Infinity;
      if (na !== nb) return na - nb;
      return String(a.number).localeCompare(String(b.number));
    });
  if (withSegs.length === 0) {
    const empty = document.createElement("div");
    empty.className = "seg-dd-empty";
    empty.textContent = "No routes loaded yet — add interstates first";

  const allOnMap = interstates.slice().sort((a, b) => {
    const na = parseInt(a.number) || Infinity;
    const nb = parseInt(b.number) || Infinity;
    if (na !== nb) return na - nb;
    return String(a.number).localeCompare(String(b.number));
  });
  if (allOnMap.length === 0) {
    const empty = document.createElement("div");
    empty.className = "seg-dd-empty";
    empty.textContent = "No interstates on map yet";
    laneDropdownEl.appendChild(empty);
    return;
  }
  allOnMap.forEach(ist => {
    const block = document.createElement("div");
    block.className = "seg-dd-route";

    const header = document.createElement("div");
    header.className = "seg-dd-route-header";
    const dot = document.createElement("span");
    dot.className = "seg-dd-dot";
    dot.style.background = ist.color;
    const nameSpan = document.createElement("span");
    nameSpan.style.flex = "1";
    const segs = ist.customSegments.length;
    const complete = ist.customSegments.filter(s => s.status === "complete").length;
    nameSpan.textContent = `${ist.name}  (${complete}/${segs})`;
    const chevron = document.createElement("span");
    chevron.className = "seg-dd-chevron";
    chevron.textContent = "▼";
    const addSegBtn = document.createElement("button");
    addSegBtn.textContent = "＋ Seg";
    addSegBtn.style.cssText = "font-size:9px;padding:1px 5px;background:transparent;border:1px solid currentColor;border-radius:2px;cursor:pointer;opacity:0.7;margin-right:4px;font-family:monospace;";
    addSegBtn.title = "Add a segment to this route";
    addSegBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      laneDropdownEl.style.display = "none";
      laneDropdownBtn.classList.remove("open");
      startDrawMode(ist.id, "segment");
    });
    header.appendChild(dot);
    header.appendChild(nameSpan);
    header.appendChild(addSegBtn);
    header.appendChild(chevron);
    const segsDiv = document.createElement("div");
    segsDiv.className = "seg-dd-segs";

    let collapsed = false;
    header.addEventListener("click", (e) => {
      e.stopPropagation();
      collapsed = !collapsed;
      segsDiv.style.display = collapsed ? "none" : "";
      chevron.textContent = collapsed ? "▶" : "▼";
    });

    if (ist.customSegments.length === 0) {
      const hint = document.createElement("div");
      hint.style.cssText = "padding:4px 10px 4px 22px;font-size:10px;opacity:0.4;border-top:1px solid var(--sb-border,#80a880);";
      hint.textContent = "No segments — click ＋ Seg to draw one";
      segsDiv.appendChild(hint);
    }

    ist.customSegments.forEach((seg, idx) => {
      const item = document.createElement("div");
      item.className = "seg-dd-item";

      const lbl = document.createElement("span");
      lbl.className = "seg-dd-label";
      lbl.textContent = seg.label || `Seg ${idx+1}`;

      const status = seg.status || "not-built";
      const statusColor = status === "complete" ? "#00ff00" : status === "in-progress" ? "#ffff00" : "#ff0000";
      const sel = document.createElement("select");
      sel.className = "seg-dd-status";
      sel.style.background = statusColor;
      [["not-built","Not Built"],["in-progress","In Progress"],["complete","Complete"]].forEach(([v,t]) => {
        const opt = document.createElement("option");
        opt.value = v; opt.textContent = t;
        if (v === status) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", (e) => {
        e.stopPropagation();
        const newStatus = e.target.value;
        seg.status = newStatus;
        seg.color = newStatus === "complete" ? "#00ff00" : newStatus === "in-progress" ? "#ffff00" : "#ff0000";
        e.target.style.background = seg.color;
        dot.style.background = ist.color;
        nameSpan.textContent = `${ist.name}  (${ist.customSegments.filter(s=>s.status==="complete").length}/${ist.customSegments.length})`;
        renderInterstates();
        // sync seg dropdown if open
        if (segDropdownEl && segDropdownEl.classList.contains("open")) buildSegDropdown();
      });

      const delBtn = document.createElement("button");
      delBtn.className = "istate-btn del";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        ist.customSegments.splice(idx, 1);
        renderInterstates();
        buildLaneDropdown();
        if (segDropdownEl && segDropdownEl.classList.contains("open")) buildSegDropdown();
      });

      item.appendChild(lbl);
      item.appendChild(sel);
      item.appendChild(delBtn);

      segsDiv.appendChild(item);
    });

    // No "Fully Complete" row in Lane Counts tab

    block.appendChild(header);
    block.appendChild(segsDiv);
    laneDropdownEl.appendChild(block);
  });
}

// Rebuild seg dropdown when open after renderInterstates

// Override renderCustomList calls via renderInterstates by patching after define
function syncSidebarFromInterstates() {
  ALL_INTERSTATES.forEach(num => {
    const numStr = String(num);
    const multi = BUNDLED_MULTI[numStr];
    if (multi) {
      multi.segments.forEach((seg, idx) => {
        const segKey = numStr + "_" + idx;
        const ist = interstates.find(i => i.multiKey === segKey && i.visible);
        const cb = document.getElementById("sb-cb-" + segKey);
        const item = document.getElementById("sb-item-" + segKey);
        if (cb) cb.checked = !!ist;
        if (item) item.classList.toggle("active", !!ist);
        const sw = item?.querySelector(".sb-swatch"); if (sw) sw.style.background = ist ? ist.color : "";
        const st = item?.querySelector(".sb-status");
        if (st) st.textContent = ist ? "\u2713" : (st.classList.contains("loading") ? st.textContent : "");
      });
    } else {
      const ist = interstates.find(i => i.number === numStr && !i.multiKey && i.visible);
      const cb = document.getElementById("sb-cb-" + numStr);
      const item = document.getElementById("sb-item-" + numStr);
      if (cb) cb.checked = !!ist;
      if (item) item.classList.toggle("active", !!ist);
      const sw = item?.querySelector(".sb-swatch"); if (sw) sw.style.background = ist ? ist.color : "";
      const st = item?.querySelector(".sb-status");
      if (st && ist) st.textContent = "\u2713";
      if (st && !ist && !st.classList.contains("loading")) st.textContent = "";
    }
  });
}

const istateSearchBox = document.getElementById("istate-search-box");
window.highlightedIstateIds = new Set();

window.applySearchHighlights = function(zoomLevel) {
  if (!mapGroup) return;
  
  if (window.highlightedIstateIds.size === 0) {
