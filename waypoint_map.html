window.highlightedCityNames = new Set();

window.applyCityHighlights = function() {
  if (!mapGroup) return;
  mapGroup.selectAll(".city-dot")
    .classed("city-highlighted", function() {
      var d = d3.select(this).datum();
      return d && window.highlightedCityNames.has(d.n);
    });
  // Raise highlighted dots above others
  mapGroup.selectAll(".city-dot.city-highlighted").raise();
};

window.clearSearchHighlights = function() {
  if (!mapGroup) return;
  window.highlightedIstateIds.clear();
  window.highlightedCityNames.clear();
  const k = d3.zoomTransform(document.getElementById("usa")).k || 1;
  mapGroup.selectAll(".istate-ghost, .istate-planned, .istate-seg")
    .attr("stroke-width", 2.1 / k);
  mapGroup.selectAll(".city-dot").classed("city-highlighted", false);
};

if (istateSearchBox) {
  const performSearch = async () => {
    const query = istateSearchBox.value.trim();

    if (!query) {
      window.clearSearchHighlights();
      return;
    }

    // Split on commas or spaces: "10, 95, 40" or "10 95 40"
    const tokens = query.split(/[\s,]+/)
      .map(t => t.replace(/^(i-|interstate\s*)/i, "").trim().toUpperCase())
      .filter(Boolean);

    if (tokens.length === 0) {
      window.clearSearchHighlights();
      return;
    }

    // For each token: if not on map, load it
    const loadPromises = tokens.map(async (numStr) => {
      const existing = interstates.find(i => String(i.number || "").toUpperCase() === numStr && !i.isCustom);
      if (existing) {
        if (!existing.visible) { existing.visible = true; reprojectInterstates(); renderInterstates(); }
        return existing;
      }
      const knownNum = ALL_INTERSTATES.find(n => String(n) === numStr || String(n).toUpperCase() === numStr);
      const multiKey = Object.keys(BUNDLED_MULTI).find(k => k.toUpperCase() === numStr);
      if (!knownNum && !multiKey && !BUNDLED_ROUTES[numStr] && !BUNDLED_ROUTES[numStr.toLowerCase()]) return null;

      const fetchNum = knownNum || numStr;
      if (BUNDLED_MULTI[String(fetchNum)]) {
        const multi = BUNDLED_MULTI[String(fetchNum)];
        const added = [];
        multi.segments.forEach((seg, idx) => {
          const segKey = String(fetchNum) + "_" + idx;
          if (!interstates.find(i => i.multiKey === segKey)) {
            interstates.push({
              id: Date.now() + Math.random(), number: String(fetchNum), name: seg.label, color: nextColor(),
              rawSegs: [seg.coords], routeSegs: [], plannedRawSegs: [], plannedRouteSegs: [],
              chainedRoute: seg.coords, multiKey: segKey,
              segColors: {}, customSegments: [], visible: true, isCustom: false
            });
          }
          added.push(interstates.find(i => i.multiKey === segKey));
        });
        reprojectInterstates(); renderInterstates();
        return added[0];
      } else {
        await sidebarFetchInterstate(String(fetchNum));
        return interstates.find(i => String(i.number || "").toUpperCase() === numStr && !i.isCustom);
      }
    });

    await Promise.all(loadPromises);

    // ADDITIVE: add newly matched IDs to the existing highlight set
    const matched = interstates.filter(i => tokens.includes(String(i.number || "").toUpperCase()));
    if (matched.length > 0 && mapGroup) {
      matched.forEach(i => window.highlightedIstateIds.add(String(i.id)));
      setTimeout(() => { window.applySearchHighlights(); }, 80);
    }

    // Also search for matching city names (case-insensitive, partial match)
    const queryLower = query.toLowerCase();
    const matchedCities = cities.filter(c => c.n.toLowerCase().includes(queryLower));
    if (matchedCities.length > 0 && mapGroup) {
      matchedCities.forEach(c => window.highlightedCityNames.add(c.n));
      setTimeout(() => { window.applyCityHighlights(); }, 80);
    }

    // Clear the search box after adding so user can type the next one
    istateSearchBox.value = "";
  };

  istateSearchBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      performSearch();
    } else if (e.key === "\\" || e.key === "Escape") {
      e.preventDefault();
      istateSearchBox.blur();
    }
  });

  // Empty input → clear all highlights live
  istateSearchBox.addEventListener("input", () => {
    if (!istateSearchBox.value.trim()) window.clearSearchHighlights();
  });
}

// ── Distance Measuring Tool ────────────────────────────────────
const measureBtn     = document.getElementById("measure-btn");
const measureReadout = document.getElementById("measure-readout");
let measurePoints    = [];   // [{pt:[x,y], lon, lat, label}]

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function totalMeasureMiles() {
  let km = 0;
  for (let i = 1; i < measurePoints.length; i++) {
    const a = measurePoints[i-1], b = measurePoints[i];
    km += haversineKm(a.lat, a.lon, b.lat, b.lon);
  }
  return km * 0.621371;
}

function updateMeasureReadout() {
  if (!measureMode) return;
  if (measurePoints.length === 0) {
    measureReadout.textContent = "Click map to start measuring";
  } else if (measurePoints.length === 1) {
    measureReadout.textContent = `📍 ${measurePoints[0].label} — click next point`;
  } else {
    const miles = totalMeasureMiles();
    const labels = measurePoints.map(p => p.label).join(" → ");
    measureReadout.textContent = `${labels} = ${miles.toFixed(1)} mi`;
  }
}

function renderMeasureOverlay() {
  mapGroup.selectAll(".measure-overlay").remove();
  if (!measureMode || measurePoints.length === 0) return;
  const k = d3.zoomTransform(document.getElementById("usa")).k;

  // Draw lines between points
  for (let i = 1; i < measurePoints.length; i++) {
    const a = measurePoints[i-1].pt, b = measurePoints[i].pt;
    mapGroup.append("line").attr("class","measure-overlay")
      .attr("x1",a[0]).attr("y1",a[1]).attr("x2",b[0]).attr("y2",b[1])
      .attr("stroke","#ffee00").attr("stroke-width", 1.5/k)
      .attr("stroke-dasharray",`${5/k},${3/k}`).attr("opacity",0.85)
      .style("pointer-events","none");
  }

  // Draw point markers
  measurePoints.forEach((p, i) => {
    const r = 4 / k;
    mapGroup.append("circle").attr("class","measure-overlay")
      .attr("cx",p.pt[0]).attr("cy",p.pt[1]).attr("r",r)
      .attr("fill","#ffee00").attr("stroke","#000").attr("stroke-width",0.8/k)
      .attr("opacity",0.95).style("pointer-events","none");
  });
}

function enterMeasureMode() {
  measureMode = true;
  measurePoints = [];
  measureBtn.classList.add("active");
  measureBtn.style.borderColor = "#ffee00";
  measureBtn.style.color = "#ffee00";
  measureReadout.style.display = "";
  updateMeasureReadout();
  document.getElementById("usa").style.cursor = "crosshair";
}

function exitMeasureMode() {
  measureMode = false;
  measurePoints = [];
  measureBtn.classList.remove("active");
  const t = themes[currentTheme];
  measureBtn.style.background = t.panelBg;
  measureBtn.style.color = t.panelFg;
  measureBtn.style.borderColor = "transparent";
  measureReadout.style.display = "none";
  mapGroup.selectAll(".measure-overlay").remove();
  mapGroup.selectAll(".snap-ring").remove();
  document.getElementById("usa").style.cursor = "";
}

measureBtn.addEventListener("click", () => {
  if (measureMode) exitMeasureMode();
  else enterMeasureMode();
});

// Click to place measure points
document.getElementById("usa").addEventListener("click", function(event) {
  if (!measureMode) return;
  const transform = d3.zoomTransform(this);
  const [mx, my] = transform.invert(d3.pointer(event, this));
  const snapR = 24 / transform.k;
  const ix = nearestIntersection(mx, my, snapR, null);
  const citySnap = nearestCityCoords(mx, my, snapR * 3);
  let pt, label, lon, lat;
  if (ix) {
    pt = ix.pt; label = ix.label;
    const ll = projection.invert(pt); lon = ll[0]; lat = ll[1];
  } else if (citySnap.pt) {
    pt = citySnap.pt; label = citySnap.name;
    const ll = projection.invert(pt); lon = ll[0]; lat = ll[1];
  } else {
    pt = [mx, my];
    const ll = projection.invert(pt); lon = ll[0]; lat = ll[1];
    label = `(${lat.toFixed(2)}°, ${lon.toFixed(2)}°)`;
  }
  measurePoints.push({ pt, lon, lat, label });
  renderMeasureOverlay();
  updateMeasureReadout();
}, true);  // capture phase so it fires even when drawMode is null

// Mousemove: show snap ring in measure mode too
document.getElementById("usa").addEventListener("mousemove", function(event) {
  if (!measureMode) return;
  mapGroup.selectAll(".snap-ring").remove();
  const transform = d3.zoomTransform(this);
  const [mx, my] = transform.invert(d3.pointer(event, this));
  const k = transform.k;
  const snapR = 24 / k;
  const ix = nearestIntersection(mx, my, snapR, null);
  if (ix) {
    const s = 8 / k;
    mapGroup.append("path").attr("class","snap-ring")
      .attr("d",`M${ix.pt[0]},${ix.pt[1]-s} L${ix.pt[0]+s},${ix.pt[1]} L${ix.pt[0]},${ix.pt[1]+s} L${ix.pt[0]-s},${ix.pt[1]} Z`)
      .attr("fill","none").attr("stroke","#ffee00").attr("stroke-width",1.5/k)
      .attr("opacity",0.9).style("pointer-events","none");
    return;
  }
  const snapped = nearestCityCoords(mx, my, snapR * 3);
  if (!snapped.pt) return;
  mapGroup.append("circle").attr("class","snap-ring")
    .attr("cx",snapped.pt[0]).attr("cy",snapped.pt[1]).attr("r",10/k)
    .attr("fill","none").attr("stroke","#ffee00").attr("stroke-width",1.5/k)
    .attr("stroke-dasharray",`${3/k},${2/k}`).attr("opacity",0.7)
    .style("pointer-events","none");
}, true);

// ── Scale bar ──────────────────────────────────────────────────
function initScaleBar() {
  updateScaleBar();
  // Scale bar updates are driven by the zoom handler calling updateScaleBar() directly
}

function updateScaleBar() {
  if (!projection) return;
  const svgEl = document.getElementById("scale-bar-svg");
  if (!svgEl) return;

  const t = themes[currentTheme];
  const barColor = t ? t.barColor : "#204820";
  const bgColor  = t ? t.barBg    : "#d0dcd0";

  // Get current zoom transform
  const transform = d3.zoomTransform(document.getElementById("usa"));
  const k = transform.k;

  // Use two screen pixels near center, invert through zoom+projection to get lon/lat
  const wrap = document.getElementById("svg-wrap");
  const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2;

  // Invert screen coords → world (SVG) coords → lon/lat
  const [wx0, wy0] = transform.invert([cx, cy]);
  const [wx1, wy1] = transform.invert([cx + 1, cy]);  // 1 screen pixel to the right

  const ll0 = projection.invert([wx0, wy0]);
  const ll1 = projection.invert([wx1, wy1]);
  if (!ll0 || !ll1) return;

  // Haversine distance for 1 screen pixel
  const R = 3958.8;
  const dLat = (ll1[1] - ll0[1]) * Math.PI / 180;
  const dLon = (ll1[0] - ll0[0]) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(ll0[1]*Math.PI/180)*Math.cos(ll1[1]*Math.PI/180)*Math.sin(dLon/2)**2;
  const milesPerPx = R * 2 * Math.asin(Math.sqrt(Math.max(0, a)));
  if (!isFinite(milesPerPx) || milesPerPx <= 0) return;

  // Pick a nice round distance that renders ~100 screen pixels wide
  const rawMiles = milesPerPx * 100;
  const allNice = [0.1,0.25,0.5,1,2,5,10,25,50,100,200,500,1000,2000,5000];
  const niceMiles = allNice.reduce((prev, cur) => Math.abs(cur - rawMiles) < Math.abs(prev - rawMiles) ? cur : prev);
  const barPx = niceMiles / milesPerPx;

  const barX = 10, barY = 18;

  // Clear and redraw
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
  svgEl.setAttribute("width", Math.round(barPx + 20));

  // Background pill
  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("x", barX - 4); bg.setAttribute("y", barY - 12);
  bg.setAttribute("width", barPx + 8); bg.setAttribute("height", 22);
  bg.setAttribute("rx", 3); bg.setAttribute("fill", bgColor); bg.setAttribute("opacity", "0.8");
  svgEl.appendChild(bg);

  // Bar line
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1", barX); line.setAttribute("y1", barY);
  line.setAttribute("x2", barX + barPx); line.setAttribute("y2", barY);
  line.setAttribute("stroke", barColor); line.setAttribute("stroke-width", "2");
  svgEl.appendChild(line);

  // End ticks
  [[barX, barY-5, barX, barY+5], [barX+barPx, barY-5, barX+barPx, barY+5]].forEach(([x1,y1,x2,y2]) => {
    const tick = document.createElementNS("http://www.w3.org/2000/svg","line");
    tick.setAttribute("x1",x1); tick.setAttribute("y1",y1);
    tick.setAttribute("x2",x2); tick.setAttribute("y2",y2);
    tick.setAttribute("stroke", barColor); tick.setAttribute("stroke-width","2");
    svgEl.appendChild(tick);
  });

  // Label
  const label = document.createElementNS("http://www.w3.org/2000/svg","text");
  label.setAttribute("x", barX + barPx / 2); label.setAttribute("y", barY - 7);
  label.setAttribute("text-anchor","middle"); label.setAttribute("font-size","10");
  label.setAttribute("font-family","monospace"); label.setAttribute("fill", barColor);
  label.textContent = niceMiles >= 1 ? `${niceMiles} mi` : `${Math.round(niceMiles * 5280)} ft`;
  svgEl.appendChild(label);
}

// Also update scale bar when theme changes — call updateScaleBar at end of applyTheme


const darkToggleBtn = document.getElementById("dark-toggle-btn");
if (darkToggleBtn) {
  darkToggleBtn.addEventListener("click", () => {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme();
  });
}
</script>
</body>
</html>
